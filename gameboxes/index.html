<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelsamling</title>
<meta name="theme-color" content="#060b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #060b14;
    --panel:   #0b1424;
    --panel-2: #0e1a2d;
    --line:    #15314d;
    --cyan:    #22d3ee;
    --cyan-dim:#0e7490;
    --violet:  #a855f7;
    --amber:   #f59e0b;
    --text:    #d8e8f5;
    --muted:   #5f7d99;
    --head: 'Chakra Petch', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:var(--bg); color:var(--text);
    font-family:var(--mono); font-size:15px; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* A faint engineering grid, plus two coloured blooms for depth. */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(34,211,238,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 120% 80% at 50% 0%, #000 20%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 120% 80% at 50% 0%, #000 20%, transparent 75%);
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 60% 50% at 15% 0%,  rgba(34,211,238,.10), transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 15%, rgba(168,85,247,.10), transparent 60%);
  }
  .wrap { position:relative; z-index:1; }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header { text-align:center; padding:64px 20px 36px; position:relative; }
  .eyebrow {
    font-family:var(--mono); font-size:.7rem; font-weight:400;
    letter-spacing:.42em; text-transform:uppercase; color:var(--cyan-dim);
    margin-bottom:18px;
  }
  h1 {
    font-family:var(--head); font-weight:700;
    font-size:clamp(2.4rem,7vw,4.6rem); line-height:.95;
    letter-spacing:.14em; text-transform:uppercase; color:#eafcff;
    text-shadow:0 0 28px rgba(34,211,238,.55), 0 0 70px rgba(34,211,238,.25);
  }
  .subtitle {
    margin-top:14px; color:var(--muted); font-size:.8rem;
    letter-spacing:.24em; text-transform:uppercase;
  }

  .stats { display:flex; justify-content:center; gap:14px; margin-top:30px; flex-wrap:wrap; }
  .stat {
    position:relative; min-width:148px; padding:14px 22px;
    background:linear-gradient(160deg, rgba(14,26,45,.9), rgba(11,20,36,.6));
    border:1px solid var(--line);
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .stat-number {
    font-family:var(--head); font-weight:700; font-size:2rem; line-height:1;
    color:var(--cyan); display:block; text-shadow:0 0 18px rgba(34,211,238,.6);
  }
  .stat-label {
    font-size:.6rem; color:var(--muted); text-transform:uppercase;
    letter-spacing:.2em; margin-top:7px; display:block;
  }

  .head-actions { margin-top:30px; }
  .scan-link {
    display:inline-block; font-family:var(--head); font-weight:600;
    font-size:.82rem; letter-spacing:.2em; text-transform:uppercase;
    text-decoration:none; color:var(--bg); background:var(--cyan);
    padding:13px 34px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    box-shadow:0 0 26px rgba(34,211,238,.45);
    transition:box-shadow .2s, transform .2s;
  }
  .scan-link:hover { box-shadow:0 0 42px rgba(34,211,238,.75); transform:translateY(-1px); }

  .rule {
    max-width:1240px; margin:0 auto; height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 12%, var(--cyan-dim) 50%, var(--line) 88%, transparent);
  }

  /* ── Controls ───────────────────────────────────────────────────────── */
  .controls {
    max-width:1240px; margin:0 auto; padding:26px 20px;
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap { flex:1; min-width:230px; position:relative; }
  .search-wrap::before {
    content:'>'; position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--cyan); font-family:var(--mono); font-weight:600; pointer-events:none;
  }
  input[type="search"] {
    width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-family:var(--mono); font-size:.9rem;
    padding:12px 14px 12px 34px; outline:none; transition:border-color .2s, box-shadow .2s;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  input[type="search"]:focus { border-color:var(--cyan); box-shadow:0 0 22px rgba(34,211,238,.22); }
  input[type="search"]::placeholder { color:var(--muted); }
  input[type="search"]::-webkit-search-cancel-button { filter:invert(.6) sepia(1) hue-rotate(150deg); }

  .filter-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .filter-btns + .filter-btns { padding-left:16px; border-left:1px solid var(--line); }
  .filter-btn {
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-family:var(--head); font-weight:600; font-size:.72rem;
    padding:11px 19px; cursor:pointer; letter-spacing:.14em; text-transform:uppercase;
    transition:all .18s;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .filter-btn:hover { color:var(--cyan); border-color:var(--cyan-dim); }
  .filter-btn.active {
    color:var(--bg); background:var(--cyan); border-color:var(--cyan);
    box-shadow:0 0 20px rgba(34,211,238,.4);
  }

  /* ── Box cards ──────────────────────────────────────────────────────── */
  .grid {
    max-width:1240px; margin:0 auto; padding:30px 20px 60px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:20px;
    align-items:start;  /* cards size to their contents instead of the tallest in the row */
  }
  .box-card {
    position:relative; padding:20px;
    background:linear-gradient(165deg, rgba(14,26,45,.92), rgba(8,15,27,.92));
    border:1px solid var(--line);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    transition:border-color .2s, transform .2s, box-shadow .2s;
    animation:fadeIn .45s ease both;
  }
  .box-card:hover {
    border-color:var(--cyan-dim); transform:translateY(-3px);
    box-shadow:0 10px 40px rgba(0,0,0,.5), 0 0 26px rgba(34,211,238,.14);
  }
  /* Corner ticks, the HUD detail that sells the whole thing. */
  .box-card::before, .box-card::after {
    content:''; position:absolute; width:15px; height:15px; pointer-events:none;
    border-color:var(--cyan); opacity:.55; transition:opacity .2s;
  }
  .box-card::before { top:7px;    right:7px;  border-top:1px solid;    border-right:1px solid; }
  .box-card::after  { bottom:7px; left:7px;   border-bottom:1px solid; border-left:1px solid; }
  .box-card:hover::before, .box-card:hover::after { opacity:1; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .box-card.hidden { display:none; }

  .box-header {
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; margin-bottom:14px; padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .box-label {
    font-family:var(--head); font-weight:700; font-size:1.3rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);
    text-shadow:0 0 16px rgba(34,211,238,.45);
  }
  .box-meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .box-tag {
    font-family:var(--head); font-size:.6rem; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; padding:4px 10px;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .tag-full { background:rgba(245,158,11,.14); color:var(--amber); border:1px solid rgba(245,158,11,.4); }
  .tag-room { background:rgba(168,85,247,.14); color:var(--violet); border:1px solid rgba(168,85,247,.45); }
  .tag-row { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .val {
    float:right; margin-left:10px; min-width:19px; text-align:center;
    font-size:.6rem; line-height:1.5; padding:1px 0;
    border:1px solid var(--line); color:var(--muted);
  }
  .val-2 { color:var(--cyan);   border-color:rgba(34,211,238,.4); }
  .val-3 { color:var(--amber);  border-color:rgba(245,158,11,.45); }
  .tag-luft { background:rgba(34,211,238,.12); color:var(--cyan);  border:1px solid rgba(34,211,238,.4); }
  .game-count { font-size:.64rem; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }

  .game-list { list-style:none; counter-reset:g; }
  .game-list li {
    counter-increment:g; position:relative; padding:5px 0 5px 30px;
    font-size:.82rem; line-height:1.35; color:var(--text);
    border-bottom:1px solid rgba(21,49,77,.5);
    transition:color .15s, padding-left .15s;
  }
  .game-list li::before {
    content:counter(g,decimal-leading-zero);
    position:absolute; left:0; top:5px;
    font-size:.64rem; color:var(--cyan-dim); letter-spacing:.06em;
  }
  .game-list li:last-child { border-bottom:none; }
  .game-list li:hover { color:var(--cyan); padding-left:34px; }
  .game-list li.highlight { color:var(--cyan); text-shadow:0 0 14px rgba(34,211,238,.5); }
  .game-list li.highlight::before { color:var(--cyan); }

  .no-results {
    grid-column:1/-1; text-align:center; color:var(--muted);
    font-size:.85rem; letter-spacing:.2em; text-transform:uppercase; padding:70px 0;
  }

  footer {
    text-align:center; padding:26px 20px 40px; color:var(--muted);
    font-size:.64rem; letter-spacing:.2em; text-transform:uppercase;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px) {
    header { padding:44px 18px 28px; }
    .stat { min-width:132px; padding:12px 16px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>

<div class="wrap">
<header>
  <p class="eyebrow">Inventering</p>
  <h1>Spelsamling</h1>
  <p class="subtitle">Brädspel per låda</p>
  <div class="stats">
    <div class="stat"><span class="stat-number" id="totalGames">0</span><span class="stat-label">Spel totalt</span></div>
    <div class="stat"><span class="stat-number" id="totalBoxes">0</span><span class="stat-label">Lådor + garderob</span></div>
  </div>
  <div class="head-actions">
    <a class="scan-link" href="/gameboxesscanner/">Skanna en ask</a>
  </div>
</header>
<div class="rule"></div>
<div class="controls">
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Sök spel eller låda…" oninput="filterAll()" autocomplete="off">
  </div>
  <div class="filter-btns" data-kind="room">
    <button class="filter-btn active" onclick="setFilter('room','all',this)">Alla förråd</button>
    <button class="filter-btn" onclick="setFilter('room','Kap 13',this)">Kap 13</button>
    <button class="filter-btn" onclick="setFilter('room','Kap 16',this)">Kap 16</button>
  </div>
  <div class="filter-btns" data-kind="status">
    <button class="filter-btn active" onclick="setFilter('status','all',this)">Alla</button>
    <button class="filter-btn" onclick="setFilter('status','full',this)">Full</button>
    <button class="filter-btn" onclick="setFilter('status','luft',this)">Luft</button>
    <button class="filter-btn" onclick="setFilter('status','garderob',this)">Garderob</button>
  </div>
</div>
<div class="rule"></div>
<div class="grid" id="grid"></div>
<footer>Alla lådor dokumenterade &mdash; 2026</footer>
</div>

// The box list is static, but games move and get added in the scanner. Read
// the shared store so this page shows the collection as it actually stands.
let games = SEED.map(g => ({ ...g }));
let filters = { room:'all', status:'all' }, currentSearch='';

function applyServer(list){
  const byId = new Map(), byName = new Map();
  games.forEach(g => {
    byId.set(g.i, g);
    const k = g.n.toLowerCase();
    if (!byName.has(k)) byName.set(k, g);
  });
  const removed = new Set();
  list.forEach(o => {
    const g = (o.id && byId.get(o.id)) || byName.get((o.namn||'').toLowerCase());
    if (o.raderad) { if (g) removed.add(g); return; }
    if (g) {
      removed.delete(g);
      if (o['låda']) g.b = o['låda'];
      g.v = o['värde'] != null ? o['värde'] : null;
    } else if (o.namn && o['låda']) {
      const ng = { i:o.id||('x'+games.length), n:o.namn, b:o['låda'], v:o['värde']!=null?o['värde']:null };
      games.push(ng);
      byName.set(ng.n.toLowerCase(), ng);
    }
  });
  if (removed.size) games = games.filter(g => !removed.has(g));
}

function setFilter(kind,value,btn){
  filters[kind]=value;
  btn.closest('.filter-btns').querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterAll();
}

function filterAll(){
  currentSearch=document.getElementById('search').value.toLowerCase();
  let visible=0;
  document.querySelectorAll('.box-card').forEach(card=>{
    const sm=(filters.status==='all'||card.dataset.status===filters.status)
           &&(filters.room==='all'||card.dataset.room===filters.room);
    const srch=!currentSearch||card.dataset.id.toLowerCase().includes(currentSearch)||card.dataset.games.toLowerCase().includes(currentSearch);
    if(sm&&srch){card.classList.remove('hidden');visible++;}
    else card.classList.add('hidden');
    card.querySelectorAll('.game-list li').forEach(li=>{
      li.classList.toggle('highlight',!!(currentSearch&&li.textContent.toLowerCase().includes(currentSearch)));
    });
  });
  document.querySelector('.no-results').style.display=visible===0?'block':'none';
}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  let total=0;
  BOXES.forEach((box,i)=>{
    const list=games.filter(g=>g.b===box.id);
    total+=list.length;
    const card=document.createElement('div');
    card.className='box-card';
    card.dataset.status=box.status||'normal';
    card.dataset.room=box.förråd;
    card.dataset.id=box.id;
    card.dataset.games=list.map(g=>g.n).join(' ');
    card.style.animationDelay=(i*0.03)+'s';
    let tag=`<span class="box-tag tag-room">${box.förråd}</span>`;
    if(box.status==='full') tag+='<span class="box-tag tag-full">Full</span>';
    else if(box.status==='luft') tag+='<span class="box-tag tag-luft">Luft</span>';
    const lbl=box.id==='Garderob'
      ?'<span class="box-label">Garderob</span>'
      :`<span class="box-label">Låda ${box.id}</span>`;
    card.innerHTML=`<div class="box-header">${lbl}<div class="box-meta"><div class="tag-row">${tag}</div><span class="game-count">${list.length} spel</span></div></div>`
      +`<ul class="game-list">${list.map(g=>`<li>${g.n}${g.v?`<span class="val val-${g.v}">${g.v}</span>`:''}</li>`).join('')}</ul>`;
    grid.appendChild(card);
  });
  const nr=document.createElement('p');
  nr.className='no-results';nr.textContent='Inga spel hittades.';nr.style.display='none';
  grid.appendChild(nr);
  document.getElementById('totalGames').textContent=total;
  document.getElementById('totalBoxes').textContent=BOXES.length;
  filterAll();
}

render();

function refresh(){
  return fetch('/gameboxesscanner/api.php?read=1', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !Array.isArray(d.games)) return;
      games = SEED.map(g => ({ ...g }));
      applyServer(d.games);
      render();
    })
    .catch(() => {});   // offline: the static list is still correct enough
}

refresh();

// Pick up changes made in the scanner without needing a manual reload.
let lastFetch = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastFetch < 10000) return;
  lastFetch = Date.now();
  refresh();
});
