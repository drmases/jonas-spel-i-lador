<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelsamling</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c09; --surface: #1a1610; --border: #3a2e1e;
    --accent: #c9973a; --text: #e8dcc8; --muted: #8a7a64;
    --full: #4a7c59; --luft: #4a6a8c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Crimson Pro',serif; font-size:17px; min-height:100vh; background-image: radial-gradient(ellipse at 20% 0%,rgba(201,151,58,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(139,69,19,.08) 0%,transparent 50%); }
  header { text-align:center; padding:60px 20px 40px; border-bottom:1px solid var(--border); position:relative; }
  header::before { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:120px; height:2px; background:var(--accent); }
  h1 { font-family:'Inter',sans-serif; font-size:clamp(2.5rem,6vw,4.5rem); font-weight:900; color:var(--accent); text-shadow:0 0 60px rgba(201,151,58,.2); }
  .subtitle { margin-top:10px; color:var(--muted); font-style:italic; }
  .stats { display:flex; justify-content:center; gap:40px; margin-top:24px; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat-number { font-family:'Inter',sans-serif; font-size:2rem; color:var(--accent); display:block; }
  .stat-label { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .controls { max-width:1200px; margin:40px auto 0; padding:0 20px 30px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); }
  .search-wrap { flex:1; min-width:220px; position:relative; }
  .search-wrap::before { content:'⌕'; position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:1.2rem; pointer-events:none; }
  input[type="search"] { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Crimson Pro',serif; font-size:1rem; padding:10px 14px 10px 38px; outline:none; transition:border-color .2s; }
  input[type="search"]:focus { border-color:var(--accent); }
  input[type="search"]::placeholder { color:var(--muted); }
  .filter-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .filter-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'Crimson Pro',serif; font-size:.85rem; padding:8px 16px; cursor:pointer; letter-spacing:.05em; text-transform:uppercase; transition:all .2s; }
  .filter-btn:hover,.filter-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(201,151,58,.07); }
  .grid { max-width:1200px; margin:0 auto; padding:40px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
  .box-card { background:var(--surface); border:1px solid var(--border); padding:22px; transition:border-color .2s,transform .2s; animation:fadeIn .4s ease both; }
  .box-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .box-card.hidden { display:none; }
  .box-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); gap:8px; }
  .box-label { font-family:'Inter',sans-serif; font-size:1.5rem; font-weight:700; color:var(--accent); }
  .box-tag { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; font-weight:600; }
  .tag-full { background:#1a3322; color:var(--full); border:1px solid rgba(74,124,89,.3); }
  .tag-luft { background:#1a2d3f; color:var(--luft); border:1px solid rgba(74,106,140,.3); }
  .game-count { font-size:.75rem; color:var(--muted); font-style:italic; }
  .game-list { list-style:none; }
  .game-list li { padding:5px 0; border-bottom:1px dotted rgba(58,46,30,.6); font-size:.95rem; color:var(--text); line-height:1.3; transition:color .15s,padding-left .15s; }
  .game-list li:last-child { border-bottom:none; }
  .game-list li:hover { color:var(--accent); padding-left:4px; }
  .game-list li.highlight { color:var(--accent); font-weight:600; }
  .no-results { grid-column:1/-1; text-align:center; color:var(--muted); font-style:italic; font-size:1.2rem; padding:60px 0; }
  footer { text-align:center; padding:30px; color:var(--muted); font-size:.85rem; border-top:1px solid var(--border); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>Spelsamling</h1>
  <p class="subtitle">Komplett inventering</p>
  <div class="stats">
    <div class="stat"><span class="stat-number" id="totalGames">0</span><span class="stat-label">Spel totalt</span></div>
    <div class="stat"><span class="stat-number" id="totalBoxes">0</span><span class="stat-label">Lådor + garderob</span></div>
  </div>
</header>
<div class="controls">
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Sök spel eller låda…" oninput="filterAll()">
  </div>
  <div class="filter-btns">
    <button class="filter-btn active" onclick="setFilter('all',this)">Alla</button>
    <button class="filter-btn" onclick="setFilter('full',this)">Full</button>
    <button class="filter-btn" onclick="setFilter('luft',this)">Luft</button>
    <button class="filter-btn" onclick="setFilter('garderob',this)">Garderob</button>
  </div>
</div>
<div class="grid" id="grid"></div>
<footer>Alla lådor dokumenterade &mdash; 2026</footer>
<script>
const data=[
  {id:"A",status:"full",games:["Survive: Escape from Atlantis!","Francis Drake","Scotland Yard ×2","Manhattan","Power Grid","Fast Sloths","Shogun"]},
  {id:"B",status:"full",games:["Vast: The Crystal Caverns","Menara","Ave Caesar","Robo Rally","Flick 'Em Up"]},
  {id:"C",status:null,games:["Pret-à-Porter","Escape from the Aliens in Outer Space","Crisis","Belfort","Brew Crafters","Race to the Rhine","Medieval","Eminent Domain","Brass: Lancashire","Paris Connection"]},
  {id:"D",status:null,games:["Tärningar + stuff","The Isle of Cats","Sidereal Confluence","Village Rails","Switch & Signal","Ghost Stories"]},
  {id:"E",status:"luft",games:["HeroQuest","Welcome to the Dungeon","Welcome Back to the Dungeon","One Night Ultimate Werewolf","The Crew: The Quest for Planet Nine","King of Tokyo: Power Up","King of Tokyo: Halloween","Spartacus","Castle Panic: The Dark Titan","Doppelt so clever","After the Virus","Power Struggle","Concordia: Salsa","Imperia 2030","Hive","Hotel Mystery"]},
  {id:"F",status:"luft",games:["Kemet + expansion","Cyclades","Doom: The Board Game","Bridges of Shangri-La","Blood Bowl","The Thing: Infection at Outpost 31"]},
  {id:"G",status:"luft",games:["Scythe + expansions","World of Warcraft: The Board Game – expansion","Magic: The Gathering","Ziplockpåsar i massor","Castle Itter"]},
  {id:"H",status:"full",games:["Parade","Don't Mess with Cthulhu","King of New York + expansion","Euphoria","Mottainai","Mord im Arosa","The Bloody Inn","Twilight Struggle","Food Chain Magnate","Legendary","Conquest of Planet Earth","Star Wars: Rebellion + expansion","Bock Rock"]},
  {id:"I",status:null,games:["Legendary – tillbehör och extra material"]},
  {id:"J1",status:"full",games:["Rivet Wars","Istanbul + expansion","Onward to Venus","Carcassonne","Junta: Viva el Presidente","Courtier","Archeos Society","Lord of the Rings: The Card Game","Pipeline","A Study in Emerald (Second Edition)"]},
  {id:"J2",status:null,games:["Race for the Galaxy + expansion","Fantasy Business","Nuns on the Run","Hive","Gamla kortspel","Dogs of War","Rapido","300: Earth & Water"]},
  {id:"K",status:"full",games:["The Rivals for Catan","Small World","Small World Underground","Small World Underground: Be Not Afraid…","Small World Underground: Spider's Web","Chimera Station","Heckmeck am Bratwurmeck","Bang! The Dice Game","Bang! The Bullet","Dixit","The Boss","Circus Flohcati","Deep Space D-6","Cash 'n Guns – expansion","Dead of Winter: A Crossroads Game","Illuminati","Operation F.A.U.S.T.","Las Vegas","Gulyabani","Lost Legacy","Abyss: Kraken","Abyss: Leviathan","Kakerlaken Poker Royal"]},
  {id:"L",status:"full",games:["Lifeboat","Euphoria – expansion","Elysium","Fury of Dracula","Point Salad","Cosmic Encounter + expansions","Barcelona","Mission: Red Planet","A Game of Thrones: The Board Game","Insider","Colt Super Express","Ticket to Ride: Europe 1912","Blitz","Planet"]},
  {id:"M",status:"full",games:["The Doolittle Raid","A Game of Thrones – expansion","Kick-Ass: The Board Game","Container","A Touch of Evil","Ticket to Ride","Carnival Zombie","Avalon","Exit","Lord of the Rings: The Card Game","Sky Runners"]},
  {id:"N",status:null,games:["Thunderbolt Apache Leader","Corsair Leader","RAF","Sherman Leader","Days of Ire","Phantom Leader","Fields of Fire","Thunder Alley"]},
  {id:"O",status:"luft",games:["Tärningar + stuff","The Isle of Cats","Sidereal Confluence","Village Rails","Switch & Signal","Ghost Stories","Furnace"]},
  {id:"P",status:null,games:["The Siege of Runedar","Circus Topito","Evil Dead: The Board Game","Northern Pacific","That's Life!","Beyond the Sun","Hit Z Road","Cyclades: Titans","Hollywood","Diner","Uluru","Make 'n' Break","Rem Purr A","Yardmaster","Yardmaster Express","Millions of Dollars","Beasty Bar","Kontor"]},
  {id:"Q",status:"luft",games:["Thurn & Taxis","Kick-Ass","Mahjong","Nemo's War","Splendor","Gravwell","Battle for Souls","Raccoon Tycoon","Innovation Deluxe","Déjà Vu?","For Sale","Push","Scout","The Crew: The Quest for Planet Nine","Deep Sea Adventure","Las Vegas","No Thanks!"]},
  {id:"R",status:"full",games:["Marvel Legendary","Colony","Trickerion","Tiny Towns","Abyss","Caverna","Room 25"]},
  {id:"S",status:null,games:["Jorvik","Skyliners","Toledo","Keltis","Cartagena","Falling Sky","The Artemis Project","Raptor","City of Horror","Mall of Horror"]},
  {id:"🚪 Garderob",status:"garderob",games:["Rising Sun","Bandu","Stronghold","Carson City","Barrage","Kanban EV","The Gallerist","Imperial","Concordia","Coffee Traders","Dominant Species","Archipelago","The Castles of Burgundy","Roll Player","Wonderlands War","Sorcerer","Smartphone Inc.","Rebel Princess","North American Railways","Hamburg","Tokyo Highway","Septima","Race to Moscow","Cuba Libre","The Thing: The Boardgame","Jórvík"]}
];

let currentFilter='all',currentSearch='';

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterAll();
}

function filterAll(){
  currentSearch=document.getElementById('search').value.toLowerCase();
  let visible=0;
  document.querySelectorAll('.box-card').forEach(card=>{
    const sm=currentFilter==='all'||card.dataset.status===currentFilter;
    const srch=!currentSearch||card.dataset.id.toLowerCase().includes(currentSearch)||card.dataset.games.toLowerCase().includes(currentSearch);
    if(sm&&srch){card.classList.remove('hidden');visible++;}
    else card.classList.add('hidden');
    card.querySelectorAll('.game-list li').forEach(li=>{
      li.classList.toggle('highlight',!!(currentSearch&&li.textContent.toLowerCase().includes(currentSearch)));
    });
  });
  document.querySelector('.no-results').style.display=visible===0?'block':'none';
}

function render(){
  const grid=document.getElementById('grid');
  let total=0;
  data.forEach((box,i)=>{
    total+=box.games.length;
    const card=document.createElement('div');
    card.className='box-card';
    card.dataset.status=box.status||'normal';
    card.dataset.id=box.id;
    card.dataset.games=box.games.join(' ');
    card.style.animationDelay=(i*0.03)+'s';
    let tag='';
    if(box.status==='full') tag='<span class="box-tag tag-full">Full</span>';
    else if(box.status==='luft') tag='<span class="box-tag tag-luft">Luft</span>';
    const lbl=box.status==='garderob'
      ?'<span class="box-label">🚪 Garderob</span>'
      :`<span class="box-label">Låda ${box.id}</span>`;
    card.innerHTML=`<div class="box-header">${lbl}<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${tag}<span class="game-count">${box.games.length} spel</span></div></div><ul class="game-list">${box.games.map(g=>`<li>${g}</li>`).join('')}</ul>`;
    grid.appendChild(card);
  });
  const nr=document.createElement('p');
  nr.className='no-results';nr.textContent='Inga spel hittades.';nr.style.display='none';
  grid.appendChild(nr);
  document.getElementById('totalGames').textContent=total;
  document.getElementById('totalBoxes').textContent=data.length;
}
render();
</script>
</body>
</html>
